# Project board for the SIEM stack repositories, defined as code for Scrum Around and Find Out (SAFO).
# A user-owned GitHub Project: no App can write one, so it is kept current from the maintainer's own
# `gh` login with `safo --board siem-stack.board.yaml reconcile` (no token is stored in CI).
# `number:` is the project `safo bootstrap` created.
version: 1
project:
  owner: ChiefGyk3D
  owner_type: user
  number: 9
  title: "SIEM Stack"
