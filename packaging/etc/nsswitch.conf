# Bind-mounted read-only over /etc/nsswitch.conf for the broker service. Every database reads local files only, so a name
# can resolve only through the generated hosts view (see safo-broker-egress-refresh.service); the service never asks a
# resolver, a name cache or a bus service.
passwd: files
group: files
shadow: files
hosts: files
networks: files
protocols: files
services: files
ethers: files
rpc: files
