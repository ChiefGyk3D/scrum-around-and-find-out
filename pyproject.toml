# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safo"
dynamic = ["version"]
description = "Scrum Around and Find Out: a GitHub Project defined as code, kept current by an Action."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ChiefGyk3D" }]
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
passkeys = ["cryptography==50.0.2"]  # Tier 2 passkey approvals only; hash-locked in requirements-passkey.txt

[project.scripts]
safo = "safo.cli:run"
safo-activity = "safo.activity:run"
safo-guard = "safo.guard:run"
safo-ship = "safo.ship:run"
safo-wait-ci = "safo.ship:run_wait_ci"
ghw = "safo.ratebudget:run"
safo-ratebudget = "safo.ratebudget_cli:entry"
safo-card = "safo.card_cli:entry"

[tool.setuptools.dynamic]
version = { attr = "safo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "packaging"]
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108"]

[tool.mypy]
strict = true
mypy_path = "src:tests:packaging"
files = ["src", "tests", "packaging"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "packaging"]
addopts = "-q --strict-markers"
