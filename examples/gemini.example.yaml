# SPDX-License-Identifier: Apache-2.0
# The config for `safo gemini` (docs/gemini.md): the FREE tier only. Copy it to ~/.config/safo/gemini.yaml, keep it
# private (mode 600), and replace every value marked REPLACE. Nothing here is a vendor limit or a secret: the limits are
# yours to copy from AI Studio, and the secret store holds the key, which this file names and never contains.
#
# There is no paid setting in this file. The paid path exists only through the broker (docs/gemini-broker.md), whose
# settings are ~/.config/safo/broker-client.yaml and /etc/safo/broker.yaml, and the paid API key exists only in the
# broker's own credential. A file that still has a paid_config, signing, caps, price_source, price_checked or paid
# setting from before the broker is refused when it loads.
version: 1

# The key is only ever sent here. Loopback http is accepted for tests; anything else is refused when the file loads.
endpoint: https://generativelanguage.googleapis.com

# Names only. The free key is read from the secret store at call time and never touches argv, a file or a log.
secrets:
  project: image-gen
  free_config: prd
  key_name: GEMINI_API_KEY

# The append-only request ledger, outside git. Omit it to use ~/.local/share/safo/gemini-spend-ledger.jsonl. If the ledger
# is missing while another gemini-spend-ledger.jsonl sits in a sibling folder, every call is refused: point this at the real one.
# ledger: /absolute/path/gemini-spend-ledger.jsonl

# Your private terms, checked against every prompt before it is sent: none, default (~/.config/safo/privacy-terms.txt) or an
# absolute path. A file that cannot be read stops the call. `none` is the written opt-out.
private_terms: default

timeout_seconds: 60
max_output_tokens: 2048

# Free-tier limits per model, per project. The vendor shows them in AI Studio and nowhere else, so they are yours to
# supply. These three are deliberately tiny so an uncopied example cannot overrun a real limit. REPLACE.
free:
  gemini-3.6-flash: {rpm: 1, tpm: 1000, rpd: 1}

# Models the free tier must refuse because they are paid-only (image generation). They are called through the broker.
# image_models: []
