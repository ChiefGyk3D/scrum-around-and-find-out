# SPDX-License-Identifier: MIT
version: 2
updates:
  # Every action is pinned to a commit with a version comment; Dependabot reads the comment and moves both.
  # "/" also covers the composite action.yml at the repository root.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release that turns out to be malicious is usually pulled within days; waiting a week costs nothing.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]

  # requirements.txt and requirements-dev.txt are pip-compile locks (not universal), so the pip ecosystem.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, python]
