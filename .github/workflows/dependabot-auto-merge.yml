# SPDX-License-Identifier: MIT
# Dependabot's own pull requests, merged once `ci / CI green` passes. A major bump is left for a person.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/dependabot-auto-merge.yml@1360d100a45897b2d658272441bc5238d6532743 # v1.16.0
    permissions:
      contents: write        # enable auto-merge on the pull request
      pull-requests: write   # read its Dependabot metadata
