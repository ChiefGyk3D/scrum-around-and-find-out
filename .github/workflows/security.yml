# SPDX-License-Identifier: Apache-2.0
# CodeQL, gitleaks, a dependency audit of the Action's one runtime dependency, dependency review on pull
# requests, Semgrep and OpenSSF Scorecard. The jobs live in ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, so new advisories surface between commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@0fc2df49cf51608a2f8b4b8eeb51d86d4d4cfaba # v1.27.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      pip-audit-requirements: requirements.txt
      # GYST v1.26.0 takes one requirements file; pip-audit repeats --requirement, so the passkey lock rides in the extra args (#216)
      pip-audit-extra-args: --requirement requirements-passkey.txt
      scorecard: true
      egress-policy: block
