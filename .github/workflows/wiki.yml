# SPDX-License-Identifier: Apache-2.0
# The GitHub wiki is a generated mirror of docs/: scripts/gen_wiki.py writes the pages and
# ChiefGyk3D/git-your-ship-together's wiki-publish.yml replaces the wiki's contents with them. It generates
# on a manual run too, and publishes only from the default branch. The generator is stdlib only, so there is
# nothing to install. Nothing here changes the `CI green` gates, which are in ci.yml.
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/gen_wiki.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/wiki-publish.yml@8fdb8d106b11aae0f37e893bb57e9bd8e8b0e7b7 # v1.24.0
    permissions:
      contents: write # the publish job only: the reusable workflow's generate job stays read-only
    with:
      generate-command: python scripts/gen_wiki.py --out "$OUT_DIR" --commit "$SOURCE_SHA"
